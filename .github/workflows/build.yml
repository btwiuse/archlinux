name: build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - 'pkgs/**'
      - 'rootfs/**'
      - 'stages'
      - 'packages'
      - 'push'
      - 'pull'
      - 'keyrings'
      - 'users'
      - 'groups'
      - 'exclude'
      - 'archs'

permissions:
  contents: read
  packages: write

jobs:
  bootstrap:
    name: ${{ matrix.arch }} -> ghcr.io
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            bootstrap_conf: pacman-bootstrap-x86_64.conf
            qemu: false
          - arch: i686
            bootstrap_conf: pacman-bootstrap-i686.conf
            qemu: true
          - arch: aarch64
            bootstrap_conf: pacman-bootstrap-aarch64.conf
            qemu: true
    steps:
      - uses: actions/checkout@v4

      - name: Install pacstrap (arch-install-scripts) and pacman (static)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y arch-install-scripts
          sudo apt-get install -y --no-install-recommends pacman-package-manager || true
          if ! command -v pacman >/dev/null; then
            echo "::warning::pacman-package-manager not in apt; fetching pacman-static from Arch"
            sudo curl -fsSL -o /usr/local/bin/pacman \
              https://pkgbuild.com/~morganamilo/pacman-static/x86_64/bin/pacman-static
            sudo chmod +x /usr/local/bin/pacman
          fi
          command -v pacman
          pacman --version | head -1

      - name: Set up QEMU (non-native arches only)
        if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@v3

      - name: "stage1: pacstrap + tar + docker import"
        env:
          ARCH: ${{ matrix.arch }}
          BOOTSTRAP_CONF: ${{ matrix.bootstrap_conf }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          IMAGE="ghcr.io/${OWNER}/arch:bootstrap-${ARCH}"
          TMPDIR=$(mktemp -d)
          export PKGDIR=$HOME/.cache/pacman/pkg
          mkdir -p "$PKGDIR"
          sudo -E pacstrap -C "rootfs/etc/${BOOTSTRAP_CONF}" -c -G -M "$TMPDIR" $(./packages bootstrap)
          sudo tar --numeric-owner --xattrs --acls --exclude-from=exclude -C "$TMPDIR" -c . \
              | docker import \
                  --change 'CMD ["/usr/bin/bash"]' \
                  - "$IMAGE"
          sudo rm -rf "$TMPDIR"
          docker images "$IMAGE"

      - name: "stage2: docker run bootstrap -> install packages + create users"
        env:
          ARCH: ${{ matrix.arch }}
          VARIANT: base
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          BOOTSTRAP_IMAGE="ghcr.io/${OWNER}/arch:bootstrap-${ARCH}"
          mkdir -p "$HOME/.cache/pacman/pkg"
          CONTAINER_NAME="stage2-${ARCH}-$(mktemp -u XXXXXXXX | tr '[:upper:]' '[:lower:]')"
          docker run -i \
              --name "$CONTAINER_NAME" \
              -v "$PWD:/root/arch" \
              -v "$HOME/.cache/pacman/pkg:/var/cache/pacman/pkg" \
              -e LC_ALL=C \
              -e VARIANT="${VARIANT}" \
              -e ARCH="${ARCH}" \
              "$BOOTSTRAP_IMAGE" bash <<-'END_OF_STAGE2'
          #!/usr/bin/env bash
          set -e
          gen-locale(){ locale-gen en_US.UTF-8; }
          ug(){
            for user in $(cat users); do
              useradd -U -ms /bin/bash ${user} && passwd -d ${user}
            done
            for group in $(cat groups); do
              groupadd -f ${group}
              for user in $(cat users); do
                usermod -a -G ${group} ${user}
              done
            done
            mkdir -p /etc/sudoers.d
            echo "%wheel ALL=(ALL:ALL) NOPASSWD: ALL" > /etc/sudoers.d/wheel
          }
          update-packages(){
            ./packages ${VARIANT} | xargs pacman -Syu --needed --noconfirm --overwrite '/*'
          }
          cd /root/arch
          cp --recursive --preserve=timestamps --backup --suffix=.pacold rootfs/* /
          ln -sf pacman-${ARCH}.conf /etc/pacman.conf
          update-packages
          gen-locale
          ug
          END_OF_STAGE2

      - name: "stage3: docker commit"
        env:
          ARCH: ${{ matrix.arch }}
          VARIANT: base
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          CONTAINER_ID=$(docker ps -aq --filter "name=stage2-${ARCH}-" | head -1)
          if [[ -z "$CONTAINER_ID" ]]; then
            echo "::error::no stage2 container for arch ${ARCH}"
            docker ps -a
            exit 1
          fi
          IMAGE="ghcr.io/${OWNER}/arch:${VARIANT}-${ARCH}"
          docker commit \
              --change 'CMD ["/usr/bin/bash"]' \
              --change 'ENV LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8 LANGUAGE=en_US:en' \
              "$CONTAINER_ID" "$IMAGE"
          docker rm "$CONTAINER_ID"
          docker images "$IMAGE"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images (bootstrap + base)
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          OWNER="${{ github.repository_owner }}"
          docker push "ghcr.io/${OWNER}/arch:bootstrap-${ARCH}"
          docker push "ghcr.io/${OWNER}/arch:base-${ARCH}"