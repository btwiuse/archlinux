name: build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - 'pkgs/**'
      - 'rootfs/**'
      - 'stages'
      - 'packages'
      - 'push'
      - 'pull'
      - 'keyrings'
      - 'users'
      - 'groups'
      - 'exclude'
      - 'archs'

permissions:
  contents: read
  packages: write

jobs:
  bootstrap:
    name: ${{ matrix.arch }} -> ghcr.io
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            bootstrap_conf: pacman-bootstrap-x86_64.conf
            qemu: false
          - arch: i686
            bootstrap_conf: pacman-bootstrap-i686.conf
            qemu: true
          - arch: aarch64
            bootstrap_conf: pacman-bootstrap-aarch64.conf
            qemu: true
    steps:
      - uses: actions/checkout@v4

      - name: Install pacstrap (arch-install-scripts) and pacman (static)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y arch-install-scripts
          sudo apt-get install -y --no-install-recommends pacman-package-manager || true
          if ! command -v pacman >/dev/null; then
            echo "::warning::pacman-package-manager not in apt; fetching pacman-static from Arch"
            sudo curl -fsSL -o /usr/local/bin/pacman \
              https://pkgbuild.com/~morganamilo/pacman-static/x86_64/bin/pacman-static
            sudo chmod +x /usr/local/bin/pacman
          fi
          command -v pacman
          pacman --version | head -1

      - name: Set up QEMU (non-native arches only)
        if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@v3

      - name: "stage1: pacstrap + tar + docker import"
        env:
          ARCH: ${{ matrix.arch }}
          BOOTSTRAP_CONF: ${{ matrix.bootstrap_conf }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          IMAGE="ghcr.io/${OWNER}/arch:bootstrap-${ARCH}"
          TMPDIR=$(mktemp -d)
          export PKGDIR=$HOME/.cache/pacman/pkg
          mkdir -p "$PKGDIR"
          sudo -E pacstrap -C "rootfs/etc/${BOOTSTRAP_CONF}" -c -G -M "$TMPDIR" $(./packages bootstrap)
          sudo tar --numeric-owner --xattrs --acls --exclude-from=exclude -C "$TMPDIR" -c . \
              | docker import \
                  --change 'CMD ["/usr/bin/bash"]' \
                  - "$IMAGE"
          sudo rm -rf "$TMPDIR"
          docker images "$IMAGE"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push bootstrap image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          OWNER="${{ github.repository_owner }}"
          docker push "ghcr.io/${OWNER}/arch:bootstrap-${ARCH}"