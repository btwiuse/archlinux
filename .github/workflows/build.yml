name: build

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['*']
    paths:
      - '.github/workflows/**'
      - 'pkgs/**'
      - 'rootfs/**'
      - 'stages'
      - 'packages'
      - 'push'
      - 'pull'
      - 'keyrings'
      - 'users'
      - 'groups'
      - 'exclude'
      - 'archs'

permissions:
  contents: write
  packages: write

jobs:
  bootstrap:
    name: ${{ matrix.arch }} -> ghcr.io
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            bootstrap_conf: pacman-bootstrap-x86_64.conf
            qemu: false
          - arch: i686
            bootstrap_conf: pacman-bootstrap-i686.conf
            qemu: true
          - arch: aarch64
            bootstrap_conf: pacman-bootstrap-aarch64.conf
            qemu: true
          - arch: riscv64
            bootstrap_conf: pacman-bootstrap-riscv64.conf
            qemu: true
    steps:
      - uses: actions/checkout@v4

      - name: Install pacstrap (arch-install-scripts) and pacman (static)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y arch-install-scripts
          sudo apt-get install -y --no-install-recommends pacman-package-manager || true
          if ! command -v pacman >/dev/null; then
            echo "::warning::pacman-package-manager not in apt; fetching pacman-static from Arch"
            sudo curl -fsSL -o /usr/local/bin/pacman \
              https://pkgbuild.com/~morganamilo/pacman-static/x86_64/bin/pacman-static
            sudo chmod +x /usr/local/bin/pacman
          fi
          command -v pacman
          pacman --version | head -1

      - name: Set up QEMU (non-native arches only)
        if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@v3

      - name: "stage1: pacstrap + tar.gz + docker import"
        env:
          ARCH: ${{ matrix.arch }}
          BOOTSTRAP_CONF: ${{ matrix.bootstrap_conf }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          IMAGE="ghcr.io/${OWNER}/arch:bootstrap-${ARCH}"
          TARBALL="dist/archlinux-base-${ARCH}.tar.gz"
          TMPDIR=$(mktemp -d)
          export PKGDIR=$HOME/.cache/pacman/pkg
          mkdir -p "$PKGDIR" dist
          sudo -E pacstrap -C "rootfs/etc/${BOOTSTRAP_CONF}" -c -G -M "$TMPDIR" $(./packages bootstrap)
          # Produce a gzip-compressed rootfs tarball for downstream consumers.
          # The same exclude rules that feed `docker import` apply here, so
          # the tarball is a faithful on-disk representation of the image.
          sudo tar --numeric-owner --xattrs --acls --exclude-from=exclude -C "$TMPDIR" -czf "$TARBALL" .
          # docker import consumes an uncompressed tar stream; pipe via gunzip.
          sudo tar --numeric-owner --xattrs --acls --exclude-from=exclude -C "$TMPDIR" -c . \
              | docker import \
                  --change 'CMD ["/usr/bin/bash"]' \
                  - "$IMAGE"
          sudo rm -rf "$TMPDIR"
          ls -la "$TARBALL"
          docker images "$IMAGE"

      - name: "stage2: docker run bootstrap -> install packages + create users"
        env:
          ARCH: ${{ matrix.arch }}
          VARIANT: base
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          BOOTSTRAP_IMAGE="ghcr.io/${OWNER}/arch:bootstrap-${ARCH}"
          mkdir -p "$HOME/.cache/pacman/pkg"
          CONTAINER_NAME="stage2-${ARCH}-$(mktemp -u XXXXXXXX | tr '[:upper:]' '[:lower:]')"
          docker run -i \
              --name "$CONTAINER_NAME" \
              -v "$PWD:/root/arch" \
              -v "$HOME/.cache/pacman/pkg:/var/cache/pacman/pkg" \
              -e LC_ALL=C \
              -e VARIANT="${VARIANT}" \
              -e ARCH="${ARCH}" \
              "$BOOTSTRAP_IMAGE" bash <<-'END_OF_STAGE2'
          #!/usr/bin/env bash
          set -e
          gen-locale(){ locale-gen en_US.UTF-8; }
          ug(){
            for user in $(cat users); do
              useradd -U -ms /bin/bash ${user} && passwd -d ${user}
            done
            for group in $(cat groups); do
              groupadd -f ${group}
              for user in $(cat users); do
                usermod -a -G ${group} ${user}
              done
            done
            mkdir -p /etc/sudoers.d
            echo "%wheel ALL=(ALL:ALL) NOPASSWD: ALL" > /etc/sudoers.d/wheel
          }
          update-packages(){
            ./packages ${VARIANT} | xargs pacman -Syu --needed --noconfirm --overwrite '/*'
          }
          cd /root/arch
          cp --recursive --preserve=timestamps --backup --suffix=.pacold rootfs/* /
          ln -sf pacman-${ARCH}.conf /etc/pacman.conf
          update-packages
          gen-locale
          ug
          END_OF_STAGE2

      - name: "stage3: docker commit"
        env:
          ARCH: ${{ matrix.arch }}
          VARIANT: base
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          CONTAINER_ID=$(docker ps -aq --filter "name=stage2-${ARCH}-" | head -1)
          if [[ -z "$CONTAINER_ID" ]]; then
            echo "::error::no stage2 container for arch ${ARCH}"
            docker ps -a
            exit 1
          fi
          IMAGE="ghcr.io/${OWNER}/arch:${VARIANT}-${ARCH}"
          docker commit \
              --change 'CMD ["/usr/bin/bash"]' \
              --change 'ENV LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8 LANGUAGE=en_US:en' \
              "$CONTAINER_ID" "$IMAGE"
          docker rm "$CONTAINER_ID"
          docker images "$IMAGE"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images (bootstrap + base)
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          OWNER="${{ github.repository_owner }}"
          docker push "ghcr.io/${OWNER}/arch:bootstrap-${ARCH}"
          docker push "ghcr.io/${OWNER}/arch:base-${ARCH}"

      - name: Upload rootfs tarball for release job
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ matrix.arch }}
          path: dist/archlinux-base-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  # ----------------------------------------------------------------------
  # After all three arches have produced :base-$ARCH images, create a
  # multi-arch manifest list :base (and :latest) and push it to GHCR.
  # Mirrors ./push's old Docker Hub manifest behavior.
  # ----------------------------------------------------------------------
  manifest:
    name: multi-arch manifest -> ghcr.io
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (needed for pulling non-native arches)
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push manifest list :base :latest
        env:
          OWNER: ${{ github.repository_owner }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="ghcr.io/${OWNER}/arch"
          # Pull the per-arch images into the local manifest store
          for arch in x86_64 i686 aarch64 riscv64; do
            docker pull "${REPO}:base-${arch}"
          done

          push_manifest(){
            local TAG="$1"
            local TARGET="${2:-$1}"
            docker manifest create "${REPO}:${TARGET}" \
              --amend "${REPO}:${TAG}-x86_64" \
              --amend "${REPO}:${TAG}-i686" \
              --amend "${REPO}:${TAG}-aarch64" \
              --amend "${REPO}:${TAG}-riscv64"
            docker manifest annotate --os linux --arch amd64          "${REPO}:${TARGET}" "${REPO}:${TAG}-x86_64"
            docker manifest annotate --os linux --arch 386            "${REPO}:${TARGET}" "${REPO}:${TAG}-i686"
            docker manifest annotate --os linux --arch arm64 --variant v8 "${REPO}:${TARGET}" "${REPO}:${TAG}-aarch64"
            docker manifest annotate --os linux --arch riscv64        "${REPO}:${TARGET}" "${REPO}:${TAG}-riscv64"
            docker manifest push "${REPO}:${TARGET}"
          }

          push_manifest base
          push_manifest base latest

          # Optional: also push the same manifest lists to Docker Hub if
          # DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are configured.
          if [[ -n "${DOCKERHUB_USERNAME:-}" && -n "${DOCKERHUB_TOKEN:-}" ]]; then
            echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
            HUB="btwiuse/arch"
            docker pull "${REPO}:base-x86_64" && docker tag "${REPO}:base-x86_64" "${HUB}:base-x86_64"
            docker pull "${REPO}:base-i686"   && docker tag "${REPO}:base-i686"   "${HUB}:base-i686"
            docker pull "${REPO}:base-aarch64" && docker tag "${REPO}:base-aarch64" "${HUB}:base-aarch64"
            docker pull "${REPO}:base-riscv64" && docker tag "${REPO}:base-riscv64" "${HUB}:base-riscv64"
            docker push "${HUB}:base-x86_64"
            docker push "${HUB}:base-i686"
            docker push "${HUB}:base-aarch64"
            docker push "${HUB}:base-riscv64"
            docker manifest create "${HUB}:base" \
              --amend "${HUB}:base-x86_64" \
              --amend "${HUB}:base-i686" \
              --amend "${HUB}:base-aarch64" \
              --amend "${HUB}:base-riscv64"
            docker manifest annotate --os linux --arch amd64            "${HUB}:base" "${HUB}:base-x86_64"
            docker manifest annotate --os linux --arch 386              "${HUB}:base" "${HUB}:base-i686"
            docker manifest annotate --os linux --arch arm64 --variant v8 "${HUB}:base" "${HUB}:base-aarch64"
            docker manifest annotate --os linux --arch riscv64          "${HUB}:base" "${HUB}:base-riscv64"
            docker manifest push "${HUB}:base"
            docker manifest create "${HUB}:latest" \
              --amend "${HUB}:base-x86_64" \
              --amend "${HUB}:base-i686" \
              --amend "${HUB}:base-aarch64" \
              --amend "${HUB}:base-riscv64"
            docker manifest annotate --os linux --arch amd64            "${HUB}:latest" "${HUB}:base-x86_64"
            docker manifest annotate --os linux --arch 386              "${HUB}:latest" "${HUB}:base-i686"
            docker manifest annotate --os linux --arch arm64 --variant v8 "${HUB}:latest" "${HUB}:base-aarch64"
            docker manifest annotate --os linux --arch riscv64          "${HUB}:latest" "${HUB}:base-riscv64"
            docker manifest push "${HUB}:latest"
          else
            echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set; skipping Docker Hub publish"
          fi

  # ----------------------------------------------------------------------
  # Publish per-arch rootfs tarballs to GitHub Releases.
  #
  # Tag naming:
  #   - push on master         -> "rootfs-<short-sha>"  (every-commit archive)
  #   - tag push (user-driven) -> "${{ github.ref_name }}" (formal release)
  #   - workflow_dispatch      -> "manual-<short-sha>"
  #
  # Each release gets the three arch tarballs as separate assets.
  # ----------------------------------------------------------------------
  release:
    name: publish rootfs tarballs -> GitHub Releases
    needs: bootstrap
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify tarballs are present
        run: |
          set -euo pipefail
          ls -la dist/
          test -f dist/archlinux-base-x86_64.tar.gz
          test -f dist/archlinux-base-i686.tar.gz
          test -f dist/archlinux-base-aarch64.tar.gz
          test -f dist/archlinux-base-riscv64.tar.gz

      - name: Pick release tag
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short="${SHORT_SHA:0:7}"
          case "${EVENT_NAME}" in
            push)
              # For a tag push, use the tag name as the release tag;
              # for a branch push, archive under rootfs-<sha>.
              if [[ "${GITHUB_REF_TYPE:-}" == "tag" || "${REF_NAME}" =~ ^v?[0-9] ]]; then
                TAG="${REF_NAME}"
                TITLE="${REF_NAME}"
              else
                TAG="rootfs-${short}"
                TITLE="rootfs ${short}"
              fi
              ;;
            workflow_dispatch)
              TAG="manual-${short}"
              TITLE="manual ${short}"
              ;;
            *)
              echo "::error::unsupported event ${EVENT_NAME}"; exit 1;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Create or update release and upload tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pick.outputs.tag }}
          TITLE: ${{ steps.pick.outputs.title }}
        run: |
          set -euo pipefail
          # `gh release` is idempotent: create-if-missing, then upload all
          # three tarballs. --clobber overwrites same-name assets so each
          # release always carries the artifacts from its own build.
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --title "${TITLE}" \
              --target "${{ github.sha }}" \
              --generate-notes \
              dist/archlinux-base-x86_64.tar.gz \
              dist/archlinux-base-i686.tar.gz \
              dist/archlinux-base-aarch64.tar.gz \
              dist/archlinux-base-riscv64.tar.gz
          else
            gh release upload "${TAG}" \
              --clobber \
              dist/archlinux-base-x86_64.tar.gz \
              dist/archlinux-base-i686.tar.gz \
              dist/archlinux-base-aarch64.tar.gz \
              dist/archlinux-base-riscv64.tar.gz
          fi
          gh release view "${TAG}"