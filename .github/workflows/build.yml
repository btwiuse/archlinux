name: build

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['*']
    paths:
      - '.github/workflows/**'
      - 'pkgs/**'
      - 'rootfs/**'
      - 'stages'
      - 'packages'
      - 'push'
      - 'pull'
      - 'keyrings'
      - 'users'
      - 'groups'
      - 'exclude'
      - 'archs'

permissions:
  contents: write
  packages: write

env:
  PKGDIR: /home/runner/.cache/pacman/pkg

jobs:
  bootstrap:
    name: ${{ matrix.arch }} -> ghcr.io
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            bootstrap_conf: pacman-bootstrap-x86_64.conf
            qemu: false
          - arch: i686
            bootstrap_conf: pacman-bootstrap-i686.conf
            qemu: true
          - arch: aarch64
            bootstrap_conf: pacman-bootstrap-aarch64.conf
            qemu: true
          - arch: riscv64
            bootstrap_conf: pacman-bootstrap-riscv64.conf
            qemu: true
    steps:
      - uses: actions/checkout@v4

      - name: Cache pacman packages between runs
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/pacman/pkg
          key: pacman-${{ matrix.arch }}-${{ hashFiles('pkgs/common/keyring') }}-${{ hashFiles('pkgs/common/base') }}-${{ hashFiles('pkgs/common/base-devel') }}-${{ hashFiles('pkgs/common/dev') }}-${{ hashFiles('pkgs/common/cmdline') }}-${{ hashFiles('pkgs/archlinux-bootstrap-packages') }}
          restore-keys: |
            pacman-${{ matrix.arch }}-

      - name: Install pacstrap (arch-install-scripts) and pacman (static)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y arch-install-scripts
          sudo apt-get install -y --no-install-recommends pacman-package-manager || true
          if ! command -v pacman >/dev/null; then
            echo "::warning::pacman-package-manager not in apt; fetching pacman-static from Arch"
            sudo curl -fsSL -o /usr/local/bin/pacman \
              https://pkgbuild.com/~morganamilo/pacman-static/x86_64/bin/pacman-static
            sudo chmod +x /usr/local/bin/pacman
          fi
          command -v pacman
          pacman --version | head -1

      - name: Set up QEMU (non-native arches only)
        if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@v3

      - name: "stage1+2+3: pacstrap -> install packages -> commit + export"
        env:
          ARCH: ${{ matrix.arch }}
          VARIANT: base
          IMAGE: ghcr.io/${{ github.repository_owner }}/arch
          PKGDIR: /home/runner/.cache/pacman/pkg
          TARBALL_DIR: dist
        run: make ci-build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images (bootstrap + base)
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/arch
        run: make push-images

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-bootstrap-${{ matrix.arch }}
          path: dist/archlinux-bootstrap-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-base-${{ matrix.arch }}
          path: dist/archlinux-base-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      # Publish this arch's rootfs tarball directly to a GitHub Release.
      # Multiple bootstrap jobs (one per arch) race to create the same
      # release tag; the first one to find it missing runs `gh release
      # create`, the rest fall through to `gh release upload --clobber`.
      # --clobber guarantees every arch's tarball ends up on the release
      # even if a previous run only partially succeeded.
      - name: Publish rootfs tarball to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          ARCH: ${{ matrix.arch }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHORT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          short="${SHORT_SHA:0:7}"
          case "${EVENT_NAME}" in
            push)
              if [[ "${GITHUB_REF_TYPE:-}" == "tag" || "${REF_NAME}" =~ ^v?[0-9] ]]; then
                TAG="${REF_NAME}"; TITLE="${REF_NAME}"
              else
                TAG="rootfs-${short}"; TITLE="rootfs ${short}"
              fi
              ;;
            workflow_dispatch)
              TAG="manual-${short}"; TITLE="manual ${short}"
              ;;
            *)
              echo "::error::unsupported event ${EVENT_NAME}"; exit 1;;
          esac
          TARBALL="dist/archlinux-bootstrap-${ARCH}.tar.gz"
          BASE_TARBALL="dist/archlinux-base-${ARCH}.tar.gz"
          for attempt in 1 2 3 4 5; do
            if gh release view "${TAG}" >/dev/null 2>&1; then
              gh release upload "${TAG}" --clobber "${TARBALL}" "${BASE_TARBALL}" && rc=0 || rc=$?
            else
              # First arch to reach this point creates the release with its
              # own tarballs; later arch jobs (and re-runs) upload via the
              # `release upload` branch above.
              gh release create "${TAG}" \
                --title "${TITLE}" \
                --target "${SHORT_SHA}" \
                --generate-notes \
                "${TARBALL}" "${BASE_TARBALL}" && rc=0 || rc=$?
            fi
            [[ ${rc:-1} -eq 0 ]] && break
            echo "::warning::gh release attempt ${attempt} (arch=${ARCH}) rc=${rc}; retrying in 30s"
            sleep 30
          done
          if [[ ${rc:-1} -ne 0 ]]; then
            echo "::error::gh release failed for arch=${ARCH} after 5 attempts"
            exit ${rc}
          fi
          gh release view "${TAG}" --json tagName,assets \
            --jq '.tagName + " assets: " + ([.assets[].name] | join(", "))'

  # ----------------------------------------------------------------------
  # Aggregate: pull every per-arch :base-$ARCH image, build a multi-arch
  # manifest list (:base + :latest), push it to GHCR (and Docker Hub if
  # configured), then verify the published manifest contains all four
  # architectures. This mirrors ./push's old explicit "pull + manifest
  # create + push" sequence.
  # ----------------------------------------------------------------------
  aggregate:
    name: aggregate -> multi-arch manifest -> ghcr.io
    needs: bootstrap
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (needed for pulling non-native arches)
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push multi-arch manifest list :base :latest
        env:
          OWNER: ${{ github.repository_owner }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="ghcr.io/${OWNER}/arch"
          for arch in x86_64 i686 aarch64 riscv64; do
            docker pull "${REPO}:bootstrap-${arch}"
            docker pull "${REPO}:base-${arch}"
          done

          push_manifest(){
            local TAG="$1"
            local TARGET="${2:-$1}"
            docker manifest create "${REPO}:${TARGET}" \
              --amend "${REPO}:${TAG}-x86_64" \
              --amend "${REPO}:${TAG}-i686" \
              --amend "${REPO}:${TAG}-aarch64" \
              --amend "${REPO}:${TAG}-riscv64"
            docker manifest annotate --os linux --arch amd64          "${REPO}:${TARGET}" "${REPO}:${TAG}-x86_64"
            docker manifest annotate --os linux --arch 386            "${REPO}:${TARGET}" "${REPO}:${TAG}-i686"
            docker manifest annotate --os linux --arch arm64 --variant v8 "${REPO}:${TARGET}" "${REPO}:${TAG}-aarch64"
            docker manifest annotate --os linux --arch riscv64        "${REPO}:${TARGET}" "${REPO}:${TAG}-riscv64"
            docker manifest push "${REPO}:${TARGET}"
          }

          push_manifest base
          push_manifest base latest
          push_manifest bootstrap

          if [[ -n "${DOCKERHUB_USERNAME:-}" && -n "${DOCKERHUB_TOKEN:-}" ]]; then
            echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
            HUB="btwiuse/arch"
            for v in bootstrap base; do
              for arch in x86_64 i686 aarch64 riscv64; do
                docker pull "${REPO}:${v}-${arch}" && docker tag "${REPO}:${v}-${arch}" "${HUB}:${v}-${arch}"
                docker push "${HUB}:${v}-${arch}"
              done
              for m in "$v" latest; do
                docker manifest create "${HUB}:${m}" \
                  --amend "${HUB}:${v}-x86_64" \
                  --amend "${HUB}:${v}-i686" \
                  --amend "${HUB}:${v}-aarch64" \
                  --amend "${HUB}:${v}-riscv64"
                docker manifest annotate --os linux --arch amd64            "${HUB}:${m}" "${HUB}:${v}-x86_64"
                docker manifest annotate --os linux --arch 386              "${HUB}:${m}" "${HUB}:${v}-i686"
                docker manifest annotate --os linux --arch arm64 --variant v8 "${HUB}:${m}" "${HUB}:${v}-aarch64"
                docker manifest annotate --os linux --arch riscv64          "${HUB}:${m}" "${HUB}:${v}-riscv64"
                docker manifest push "${HUB}:${m}"
              done
            done
          else
            echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set; skipping Docker Hub publish"
          fi

      - name: Verify multi-arch manifests contain all four arches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set +e
          TOKEN=$(curl -fsS -u "${OWNER}:${GH_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${OWNER}/arch:pull" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
          for tag in bootstrap base; do
            echo "===== ${tag} ====="
            MANIFEST=$(curl -fsS \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.index.v1+json" \
              "https://ghcr.io/v2/${OWNER}/arch/manifests/${tag}")
            echo "$MANIFEST" | python3 "${GITHUB_WORKSPACE}/.github/scripts/verify-manifest.py" ":${tag}"
          done

