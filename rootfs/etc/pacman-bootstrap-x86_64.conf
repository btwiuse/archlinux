[options]
HoldPkg     = pacman glibc
# XferCommand = /usr/bin/curl -k -L -C - -f -o %o %u
Architecture = auto
ILoveCandy
Color
VerbosePkgLists
SigLevel = Never TrustAll
LocalFileSigLevel = Never TrustAll
RemoteFileSigLevel = Never TrustAll

# The testing repositories are disabled by default. To enable, uncomment the
# repo name header and Include lines. You can add preferred servers immediately
# after the header, and they will be used before the default mirrors.

# [testing]
# Include = rootfs/etc/pacman.d/mirrorlist

# [community-staging]
# Include = rootfs/etc/pacman.d/mirrorlist

# [community-testing]
# Include = rootfs/etc/pacman.d/mirrorlist

[core]
Include = rootfs/etc/pacman.d/mirrorlist

[extra]
Include = rootfs/etc/pacman.d/mirrorlist

[community]
Include = rootfs/etc/pacman.d/mirrorlist

[blackarch]
# Include = /etc/pacman.d/blackarch-mirrorlist
Server = http://mirrors.ustc.edu.cn/blackarch/$repo/os/$arch
Server = http://mirrors.tuna.tsinghua.edu.cn/blackarch/$repo/os/$arch

[btwiuse]
Server = https://github.com/btwiuse/archpkg/releases/download/current/

[archlinuxcn]
Server = http://mirrors.tuna.tsinghua.edu.cn/archlinuxcn/$arch
Server = http://mirrors.ustc.edu.cn/blackarch/archlinuxcn/$arch

